name: ground-turn
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-ground-turn}-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ground_turn}
      MYSQL_USER: ${DB_USER:-ground}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ground}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ground}
    ports:
      - "${DB_PORT:-33060}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-ground}"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ground-turn}-backend
    env_file:
      - .env
    environment:
      SERVER_PORT: 3000
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ground_turn}
      DB_USER: ${DB_USER:-ground}
      DB_PASSWORD: ${DB_PASSWORD:-ground}
    ports:
      - "${BACKEND_PORT:-21108}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ground-turn}-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-20108}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  db_data:
